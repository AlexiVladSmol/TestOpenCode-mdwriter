[workspace]
resolver = "2"
members = ["crates/app", "crates/graph", "crates/index", "crates/markdown", "crates/preview", "crates/vault"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/AlexiVladSmol/TestOpenCode-mdwriter"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["syntect"] }
walkdir = "2.5"
notify = "8"
thiserror = "2"
pulldown-cmark = "0.13"
petgraph = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
