[workspace]
resolver = "2"
members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AlexeiSmol/TestOpenCode-mdwriter"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.37"
egui_extras = "0.37"
rfd = "0.17"
